[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-tts"
version = "0.2.0"
description = "Cross-platform F5-TTS voice cloning CLI and Python package."
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = "MIT"
authors = [{ name = "WVU AI Club" }]
dependencies = ["f5-tts==1.1.22", "faster-whisper>=1.2,<2"]

[project.optional-dependencies]
cpu = ["torch==2.11.0", "torchaudio==2.11.0"]
cu128 = ["torch==2.11.0", "torchaudio==2.11.0"]
cu130 = ["torch==2.11.0", "torchaudio==2.11.0"]

[project.scripts]
custom-tts = "custom_tts.cli:main"

[project.urls]
Repository = "https://github.com/WVU-AIClub/Custom-TTS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
