# Default configuration for the custom-tts pipeline.
# Any value here can be overridden by a user config file (--config) or by CLI flags.

# Target sample rate (Hz) used across preprocessing and synthesis.
sample_rate: 22050

# ---------------------------------------------------------------------------
# Data preprocessing pipeline
# ---------------------------------------------------------------------------
preprocess:
  # Audio longer than this (milliseconds) is split into chunks.
  chunk_length_ms: 30000
  # Whisper model size used for transcription (tiny, base, small, medium, large).
  whisper_model: base
  # librosa silence-trim threshold in decibels below peak.
  trim_top_db: 20
  # Whether to peak-normalize audio during processing.
  normalize: true
  # Output PCM subtype written by soundfile.
  subtype: PCM_16
  # Name of the transcript file written into the voice folder.
  metadata_filename: metadata.csv
  # Subfolder names created/used inside the voice folder.
  dirs:
    raws: raws
    splits: splits
    wavs: wavs
    outputs: outputs

# ---------------------------------------------------------------------------
# Training (python -m piper.train fit)
# ---------------------------------------------------------------------------
train:
  # Voice name passed to Piper. Defaults to the voice folder name when null.
  voice_name: null
  # eSpeak-ng voice/phonemizer (run `espeak-ng --voices` for options).
  espeak_voice: en-us
  # Training batch size (lower to 4/2 if you run out of GPU memory).
  batch_size: 4
  # Optional cap on training epochs (null = Lightning default / run until stopped).
  max_epochs: null
  # Subfolder (inside the voice folder) for the phoneme/spec cache.
  cache_dirname: piper_cache
  # Piper config JSON filename inside the voice folder. Defaults to "<voice_name>.onnx.json".
  config_filename: null
  # Optional checkpoint to resume from or fine-tune (local path or URL).
  ckpt_path: null
  # Where Lightning writes version_*/checkpoints.
  log_dir: lightning_logs
  # Export to ONNX automatically after training stops (typically Ctrl+C).
  export_after: false

# ---------------------------------------------------------------------------
# Export checkpoint -> ONNX (python -m piper.train.export_onnx)
# ---------------------------------------------------------------------------
export:
  # Explicit .ckpt to export. When null, the latest checkpoint under log_dir is used.
  checkpoint: null
  # Where to search for checkpoints when 'checkpoint' is null.
  log_dir: lightning_logs
  # Output ONNX path. Defaults to "<voice_folder>/<voice_name>.onnx" when null.
  output: null

# ---------------------------------------------------------------------------
# Inference / synthesis
# ---------------------------------------------------------------------------
inference:
  # Path to the Piper voice. Either the ".onnx" file or its stem.
  model: null
  # Text to synthesize.
  text: "Hello, world."
  # Output WAV path.
  output: output.wav
  # Synthesis controls (see piper SynthesisConfig).
  volume: 0.5
  length_scale: 1.4
  noise_scale: 1.0
  noise_w_scale: 1.5
  normalize_audio: false
